name: Build installers

# Builds the macOS .dmg and the Windows .exe installer.
# Needs a repository variable NETLOGO_FORK pointing at YOUR NetLogo Desktop fork (the chat integration lives there),
# plus optional NETLOGO_REF (branch/tag, default main).  Settings > Secrets and variables > Actions > Variables.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.4)"
        default: "1.0.4"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  APP_VERSION: ${{ inputs.version || '1.0.4' }}

jobs:
  macos:
    name: macOS (arm64 .dmg)
    runs-on: macos-14
    steps:
      - name: Check out MemoSim
        uses: actions/checkout@v4
        with:
          path: chat
      - name: Check out the NetLogo fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NETLOGO_FORK }}
          ref: ${{ vars.NETLOGO_REF || 'main' }}
          path: netlogo
          token: ${{ secrets.NETLOGO_FORK_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: chat
        run: npm ci
      - name: Build .dmg
        working-directory: chat
        env:
          NETLOGO_SRC: ${{ github.workspace }}/netlogo
          BUILD_ROOT: ${{ runner.temp }}/build
        run: ./scripts/build-mac-app.sh --no-install --installer dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MemoSim-macos-arm64
          path: ${{ runner.temp }}/build/release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64 installer)
    runs-on: windows-latest
    steps:
      - name: Check out MemoSim
        uses: actions/checkout@v4
        with:
          path: chat
      - name: Check out the NetLogo fork
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NETLOGO_FORK }}
          ref: ${{ vars.NETLOGO_REF || 'main' }}
          path: netlogo
          token: ${{ secrets.NETLOGO_FORK_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install WiX Toolset
        run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - name: Install web dependencies
        working-directory: chat
        run: npm ci
      - name: Build installer
        working-directory: chat
        run: >
          ./scripts/build-windows-app.ps1
          -NetLogoSrc "${{ github.workspace }}\netlogo"
          -BuildRoot "${{ runner.temp }}\build"
          -Version "${{ env.APP_VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: MemoSim-windows-x64
          path: ${{ runner.temp }}/build/release/*.exe
          if-no-files-found: error
