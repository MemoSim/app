name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    # windows-2022 ships the Visual Studio C++ workload that node-gyp needs for better-sqlite3;
    # windows-latest does not, and `npm ci` then dies building that native module.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 x64
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: x64

      - name: Install sbt and WiX Toolset
        run: |
          # The runner already ships sbt and a newer WiX; a pinned/locked choco call exits 1 and fails the job.
          choco install sbt --no-progress -y || true
          choco install wixtoolset --no-progress -y || true
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          sbt --version; candle.exe -? 2>&1 | Select-Object -First 1

      - name: Install chat dependencies
        working-directory: chat
        run: npm ci

      - name: Build MemoSim installer
        working-directory: chat
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows-app.ps1

      - name: Show build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "chat/build-windows.log"
          if (Test-Path $log) {
            Write-Host "----- chat/build-windows.log (tail 120) -----"
            Get-Content $log -Tail 120
          } else {
            Write-Host "no chat/build-windows.log; listing candidates"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.log" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 FullName
          }
        if: failure()
        run: |
          Write-Host "--- java/sbt ---"
          java -version 2>&1 | Out-String | Write-Host
          sbt --version 2>&1 | Out-String | Write-Host
          Write-Host "--- logs found ---"
          Get-ChildItem -Path . -Recurse -Filter 'build-windows.log' -ErrorAction SilentlyContinue | Select-Object FullName,Length | Format-Table | Out-String | Write-Host
          Get-ChildItem -Path $env:USERPROFILE -Filter 'build-windows.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 100 }

      - name: Show artefact
        run: |
          Get-ChildItem "$env:USERPROFILE\dev\netlogo-chat-build\release" | Format-Table Name,Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MemoSim-Windows-installer
          path: |
            ${{ env.USERPROFILE }}/dev/netlogo-chat-build/release/*.exe
            ${{ env.USERPROFILE }}/dev/netlogo-chat-build/release/*.msi
            ${{ env.USERPROFILE }}/dev/netlogo-chat-build/release/*.sha256
          if-no-files-found: error
